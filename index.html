<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Inteligente Dinámica</title>
    
    <!-- Vinculación de los estilos globales compartidos -->
    <link rel="stylesheet" href="assets/css/global.css">
    
    <!-- Estilo temporal para evitar el parpadeo visual antes de cargar al usuario -->
    <style>
        #app { opacity: 0; transition: opacity 0.3s ease; }
        #app.ready { opacity: 1; }
    </style>
</head>
<body>

    <!-- Contenedor base de la aplicación -->
    <div id="app">
        <header id="global-header"></header>
        
        <main id="main-content">
            <!-- Esta sección se mostrará solo a los visitantes de la página principal -->
            <div id="auth-container" class="auth-box">
                <h2>Crea tu Espacio Inteligente</h2>
                <p>Elige tu método de autenticación preferido para registrarte u obtener tu página web personalizada.</p>
                
                <!-- Botones de Autenticación Social (OAuth 2.0) -->
                <div class="oauth-buttons">
                    <button id="btn-google" class="btn btn-google">
                        <span>Iniciar sesión con Google</span>
                    </button>
                    <button id="btn-facebook" class="btn btn-facebook">
                        <span>Iniciar sesión con Facebook</span>
                    </button>
                </div>

                <div class="divider"><span>o también puedes</span></div>

                <!-- Formulario de Simulación Técnica de Registro -->
                <form id="registro-simulado-form" class="registro-form">
                    <div class="form-group">
                        <label for="reg-nombre">Nombre Comercial o de Usuario:</label>
                        <input type="text" id="reg-nombre" placeholder="Ej. Carlos Diseños" required>
                    </div>
                    <button type="submit" class="btn btn-submit">Crear Estructura Virtual</button>
                </form>
            </div>

            <!-- Contenedor dinámico secundario para pintar los perfiles de los clientes -->
            <div id="cliente-container" style="display: none;"></div>
        </main>
        
        <footer id="global-footer"></footer>
    </div>

    <!-- El motor JS inteligente -->
    <script src="assets/js/router.js" type="module"></script>
</body>
</html>
